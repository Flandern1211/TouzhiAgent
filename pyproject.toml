[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touzh-agent"
version = "0.1.0"
description = "Local Chinese public fund research and risk monitoring assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "httpx>=0.27,<1",
    "pymysql>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[project.scripts]
fund-agent = "fund_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
